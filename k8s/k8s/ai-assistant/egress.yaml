apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-assistant-restrict
spec:
  podSelector:
    matchLabels:
      app: ai-assistant 
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
        - podSelector: {}
      ports: [{protocol: UDP, port: 53}] #DNS
