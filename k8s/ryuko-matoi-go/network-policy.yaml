apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ryuko-matoi-restrict
spec:
  podSelector:
    matchLabels:
      app: ryuko-matoi 
    policyTypes: [Egress]
    egress:
      - to:
          - namespaceSelector: {}
          - podSelector: {}
        ports: [{protocol: UDP, port: 53}] # DNS 
      - to:
          - ipBlock:
              cidr: 0.0.0.0/0 
              except: [10.0.0.0/8, 172.16.0.0/2, 192.168.0.0/16]
        ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 5222}]
