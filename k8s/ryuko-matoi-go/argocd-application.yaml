apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bots
  namespace: argocd
spec:
  description: Bot applications
  sourceRepos:
    - "https://github.com/haikelz/devops.git"
  destinations:
    - namespace: bots
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ryuko-matoi-go
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: bots
  source:
    repoURL: https://github.com/haikelz/devops.git
    targetRevision: master
    path: k8s/ryuko-matoi-go
    directory:
      exclude: "{argocd-application.yaml,argocd-app-project.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: bots
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - CreateNamespace=true
