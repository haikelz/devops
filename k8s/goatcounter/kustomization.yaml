apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - services.yaml
  - deployment.yaml
  - goatcounter.yaml
  - redis.yaml
  - middleware.yaml
  - ingress.yaml

# Session/API configuration is generated from k8s/gtcd.env (gitignored).
# Copy k8s/gtcd.env.example to k8s/gtcd.env and fill in real values.
secretGenerator:
  - name: gtcd-env
    envs:
      - gtcd.env

images:
  - name: haikelilham/gtcd
    newTag: latest
