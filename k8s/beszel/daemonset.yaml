apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: beszel-agent
  labels:
    app: beszel-agent
spec:
  selector:
    matchLabels:
      app: beszel-agent
  template:
    metadata:
      labels:
        app: beszel-agent
    spec:
      hostNetwork: true
      hostPID: false
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: agent-data
          hostPath:
            path: /var/lib/beszel-agent
            type: DirectoryOrCreate
      containers:
        - name: beszel-agent
          image: henrygd/beszel-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 45876
              name: agent
              hostPort: 45876
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
              readOnly: true
            - name: agent-data
              mountPath: /var/lib/beszel-agent
          env:
            - name: LISTEN
              value: "45876"
            - name: HUB_URL
              value: http://beszel:8090
            - name: KEY
              valueFrom:
                secretKeyRef:
                  name: beszel-env
                  key: KEY
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: beszel-env
                  key: TOKEN
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          startupProbe:
            tcpSocket:
              port: 45876
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 45876
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 45876
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - SYS_PTRACE
