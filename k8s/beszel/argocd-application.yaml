apiVersion: argocd.io/v1alpha1
kind: Application
metadata:
  name: beszel
  namespace: argocd
spec:
  project: monitoring
  source:
    repoURL: https://github.com/haikelz/devops.git
    targetRevision: master
    path: k8s/beszel
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
