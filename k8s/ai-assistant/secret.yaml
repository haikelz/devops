apiVersion: v1
kind: Secret
metadata:
  name: ai-assistant-env
type: Opaque
stringData:
  AI_PROVIDER: "${AI_PROVIDER}"
  AI_MODEL: "${AI_MODEL}"
  SUMOPOD_API_KEY: "${SUMOPOD_API_KEY}"
  GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
  OPENAI_API_KEY: "${OPENAI_API_KEY}"
  TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
  TELEGRAM_USER_ID: "${TELEGRAM_USER_ID}"
  WHATSAPP_RECIPIENT: "${WHATSAPP_RECIPIENT}"
  JOB_ALERT_PIPELINE_ENABLED: "${JOB_ALERT_PIPELINE_ENABLED}"
  GLINTS_ENABLED: "${GLINTS_ENABLED}"
  LINKEDIN_ENABLED: "${LINKEDIN_ENABLED}"
  LINKEDIN_PAGES: "${LINKEDIN_PAGES}"
  LINKEDIN_MAX_DETAILS: "${LINKEDIN_MAX_DETAILS}"
  LINKEDIN_POSTED_WITHIN_HOURS: "${LINKEDIN_POSTED_WITHIN_HOURS}"
  LINKEDIN_DISTANCE: "${LINKEDIN_DISTANCE}"
  LINKEDIN_JOB_TYPES: "${LINKEDIN_JOB_TYPES}"
  LINKEDIN_COMPANY_IDS: "${LINKEDIN_COMPANY_IDS}"
  JOB_ALERT_DB_PATH: "${JOB_ALERT_DB_PATH}"
  JOB_ALERT_MAX_QUERIES: "${JOB_ALERT_MAX_QUERIES}"
  JOB_ALERT_AI_BATCH_SIZE: "${JOB_ALERT_AI_BATCH_SIZE}"
  JOB_ALERT_MIN_MATCH_SCORE: "${JOB_ALERT_MIN_MATCH_SCORE}"
  MAIL_MAILER: "${MAIL_MAILER}"
  MAIL_USERNAME: "${MAIL_USERNAME}"
  MAIL_PASSWORD: "${MAIL_PASSWORD}"
  MAIL_HOST: "${MAIL_HOST}"
  MAIL_PORT: "${MAIL_PORT}"
  MAIL_ENCRYPTION: "${MAIL_ENCRYPTION}"
  MAIL_FROM: "${MAIL_FROM}"
  MAIL_TO: "${MAIL_TO}"
