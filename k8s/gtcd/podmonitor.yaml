# Prometheus Operator scrape target for gtcd's Watt metrics (port "metrics" in
# deployment.yaml). ../deploy-k8s.sh applies it only when the PodMonitor CRD
# exists. kube-prometheus-stack selects PodMonitors by its release label by
# default; set prometheus.prometheusSpec.podMonitorSelectorNilUsesHelmValues:
# false in its values to pick this one up.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gtcd
  labels:
    app: gtcd
spec:
  selector:
    matchLabels:
      app: gtcd
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
